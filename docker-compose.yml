version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: godknife-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: godknife
      POSTGRES_PASSWORD: godknife_password
      POSTGRES_DB: godknife
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - godknife-network

  minio:
    image: minio/minio:latest
    container_name: godknife-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: godknife
      MINIO_ROOT_PASSWORD: godknife_password
    ports:
      - "9009:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - godknife-network

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc config host add myminio http://minio:9000 godknife godknife_password; do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb -p myminio/godknife-images;
      /usr/bin/mc anonymous set public myminio/godknife-images;
      exit 0;
      "
    networks:
      - godknife-network

  redis:
    image: redis:7-alpine
    container_name: godknife-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - godknife-network

  soketi:
    image: quay.io/soketi/soketi:latest-16-alpine
    container_name: godknife-soketi
    restart: unless-stopped
    ports:
      - "6001:6001"
      - "9601:9601"
    environment:
      SOKETI_DEBUG: "1"
      SOKETI_METRICS_SERVER_PORT: "9601"
      SOKETI_DEFAULT_APP_ID: "godknife-app"
      SOKETI_DEFAULT_APP_KEY: "godknife-key"
      SOKETI_DEFAULT_APP_SECRET: "godknife-secret"
    networks:
      - godknife-network

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  godknife-network:
    driver: bridge
